# Approved mapping: generated by `migrator propose` (see mapping.proposed.yaml),
# then reviewed by hand. Every MANUAL entry explains why it differs from the heuristic.
source:
  database: bank
  schema: public
embed_max: 100
lookup_max: 1000
collections:
  branches:
    from_table: branches
    id: branch_id
    reason: lookup table (50 rows < 1000), no FKs of its own, referenced by ['accounts', 'employees', 'loans']
    embed:
    - table: employees
      as: employees
      fk: branch_id
      id: employee_id
      reason: 1:few into branches (max 16, avg 12.2 <= 100), no inbound FKs
  customers:
    from_table: customers
    id: customer_id
    reason: referenced by ['account_holders', 'addresses', 'beneficiaries', 'loans']
    embed:
    - table: addresses
      as: addresses
      fk: customer_id
      id: address_id
      reason: 1:few into customers (max 2, avg 1.5 <= 100), no inbound FKs
    - table: beneficiaries
      as: beneficiaries
      fk: customer_id
      id: beneficiary_id
      reason: 1:few into customers (max 8, avg 3.2 <= 100), no inbound FKs; business cap of 50 beneficiaries keeps
        it bounded
    many_to_many:
    - via: account_holders
      as: account_ids
      local_fk: customer_id
      remote_fk: account_id
      reason: 'join table: composite PK [''account_id'', ''customer_id''] = 2 FKs (accounts, customers); customer
        side stores ids only (holder role lives on the account)'
  accounts:
    from_table: accounts
    id: account_id
    reason: referenced by ['account_holders', 'cards', 'transactions']
    embed:
    - table: cards
      as: cards
      fk: account_id
      id: card_id
      reason: 1:few into accounts (max 3, avg 1.4 <= 100), no inbound FKs
    extended_refs:
    - table: account_types
      as: type
      fk: type_id
      fields:
      - type_id
      - code
      - name
      - interest_rate
      reason: lookup table (4 rows < 1000), no FKs of its own, referenced by ['accounts']; copy a few fields to
        avoid a lookup on every read
    - table: branches
      as: branch
      fk: branch_id
      fields:
      - branch_id
      - code
      - name
      - ifsc
      reason: lookup table (50 rows < 1000), no FKs of its own, referenced by ['accounts', 'employees', 'loans'];
        copy a few fields to avoid a lookup on every read
    many_to_many:
    - via: account_holders
      as: holders
      local_fk: account_id
      remote_fk: customer_id
      keep_fields:
      - customer_id
      - role
      reason: 'join table: composite PK [''account_id'', ''customer_id''] = 2 FKs (accounts, customers)'
  loans:
    from_table: loans
    id: loan_id
    reason: referenced by ['loan_payments']
    embed:
    - table: loan_payments
      as: payments
      fk: loan_id
      id: payment_id
      reason: 'MANUAL OVERRIDE: measured max is only 47 because loans are young; the real bound is tenure_months
        (<= 360). 360 x ~150 B = ~54 KB, far below 16 MB, and the schedule is always read with the loan'
    references:
    - field: customer_id
      collection: customers
      reason: plain id reference
    - field: branch_id
      collection: branches
      reason: 'MANUAL: loan screens don''t show branch details; plain id avoids another fan-out update'
  transactions:
    from_table: transactions
    id: txn_id
    reason: fan-out per accounts unbounded/large (max 8904 > 100)
    references:
    - field: account_id
      collection: accounts
      reason: plain id reference
ignore_tables:
- canary
tables:
  account_holders:
    pk:
    - account_id
    - customer_id
    columns:
      account_id: integer
      customer_id: integer
      role: text
  account_types:
    pk:
    - type_id
    columns:
      type_id: integer
      code: character varying
      name: character varying
      interest_rate: numeric
      min_balance: numeric
  accounts:
    pk:
    - account_id
    columns:
      account_id: integer
      account_no: character
      type_id: integer
      branch_id: integer
      balance: numeric
      status: text
      opened_at: timestamp with time zone
  addresses:
    pk:
    - address_id
    columns:
      address_id: integer
      customer_id: integer
      type: text
      line1: character varying
      city: character varying
      state: character varying
      pincode: character
  beneficiaries:
    pk:
    - beneficiary_id
    columns:
      beneficiary_id: integer
      customer_id: integer
      name: character varying
      account_no: character
      ifsc: character
      added_at: timestamp with time zone
  branches:
    pk:
    - branch_id
    columns:
      branch_id: integer
      code: character varying
      name: character varying
      city: character varying
      ifsc: character
      opened_on: date
  cards:
    pk:
    - card_id
    columns:
      card_id: integer
      account_id: integer
      last4: character
      network: text
      expires_on: date
      status: text
  customers:
    pk:
    - customer_id
    columns:
      customer_id: integer
      name: character varying
      email: character varying
      phone: character varying
      dob: date
      kyc_status: text
      created_at: timestamp with time zone
  employees:
    pk:
    - employee_id
    columns:
      employee_id: integer
      branch_id: integer
      name: character varying
      role: text
      email: character varying
      hired_on: date
  loan_payments:
    pk:
    - payment_id
    columns:
      payment_id: integer
      loan_id: integer
      due_date: date
      paid_on: date
      amount: numeric
      status: text
  loans:
    pk:
    - loan_id
    columns:
      loan_id: integer
      customer_id: integer
      branch_id: integer
      principal: numeric
      rate: numeric
      tenure_months: smallint
      status: text
      disbursed_on: date
  transactions:
    pk:
    - txn_id
    columns:
      txn_id: bigint
      account_id: integer
      type: text
      amount: numeric
      balance_after: numeric
      description: character varying
      counterparty: character
      created_at: timestamp with time zone
