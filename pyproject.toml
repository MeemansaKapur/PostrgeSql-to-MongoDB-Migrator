[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",   # PostgreSQL driver
    "pymongo>=4.8",
    "confluent-kafka>=2.5",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "faker>=28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
migrator = "migrator.cli:app"

[tool.setuptools.packages.find]
include = ["migrator*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs the docker stack and a running sync"]
addopts = "-m 'not integration'"
